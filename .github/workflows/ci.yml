name: CI - Build & Push Backend Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Push Backend Image
      run: |
        docker build -t ghcr.io/${{ github.actor }}/cicd-backend:latest ./backend
        docker push ghcr.io/${{ github.actor }}/cicd-backend:latest

