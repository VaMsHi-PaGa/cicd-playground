name: CI/CD - Build, Push & Deploy to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image namespace
        id: vars
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/cicd-backend:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/cicd-backend:latest

  deploy:
    name: Deploy to OVH VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: devops
          key: 310398
          script: |
            set -e
            cd ~/deploy

            echo "Logging into GHCR on VPS"
            docker login ghcr.io \
              -u ${{ secrets.GHCR_USER }} \
              -p ${{ secrets.GHCR_TOKEN }}

            echo "Pulling latest image"
            docker compose pull

            echo "Deploying containers"
            docker compose up -d

            echo "Deployment successful"

